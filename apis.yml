name: Remix 3
description: Remix (YC W26, "remix-3" in the Y Combinator directory) is a San Francisco
  AI startup building a consumer social-media content platform under the tagline "Trends,
  remixed by you." Users connect their accounts and drop in photos, voice notes, or
  messages, and Remix uses hundreds of parallel AI agents to auto-generate posts in
  their style — articles, tweets, carousels, and short-form videos, including riffs
  on trending formats — without manual prompting. The company was founded in 2025 by
  Sam Kaplan (Harvard CS; early Brex employee). As of this enrichment pass Remix ships
  a consumer web/mobile product only and publishes no public developer API, SDK, docs,
  or webhook surface, so this remains an identity-only profile in the API Evangelist
  network.
